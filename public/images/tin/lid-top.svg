<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 330">
<!-- Lid top of Angela's tin: an original illustration inspired by the real one -->
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1eee8"/><stop offset=".45" stop-color="#d9d4cb"/><stop offset=".7" stop-color="#e7e3dc"/><stop offset="1" stop-color="#cbc5ba"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity=".3"/><stop offset=".84" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3b2a20" flood-opacity=".28"/></filter>
<radialGradient id="pearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ece6de"/><stop offset="1" stop-color="#bdb3a8"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0dc9c"/><stop offset=".5" stop-color="#c9a957"/><stop offset="1" stop-color="#9c7d36"/></linearGradient>
<clipPath id="body"><rect x="4" y="4" width="492" height="322" rx="40"/></clipPath>
<path id="star" d="M0,-1 L0.235,-0.324 L0.951,-0.309 L0.38,0.124 L0.588,0.809 L0,0.4 L-0.588,0.809 L-0.38,0.124 L-0.951,-0.309 L-0.235,-0.324Z"/>
<pattern id="floral" width="28" height="32" patternUnits="userSpaceOnUse">
  <rect width="28" height="32" fill="#9a5638"/>
  <g fill="#f3e3d0"><circle cx="3.5" cy="4" r="1.5"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="17.5" cy="4" r="1.5"/><circle cx="24.5" cy="4" r="1.5"/>
  <circle cx="3.5" cy="28" r="1.5"/><circle cx="10.5" cy="28" r="1.5"/><circle cx="17.5" cy="28" r="1.5"/><circle cx="24.5" cy="28" r="1.5"/>
  <circle cx="14" cy="12.6" r="2.6"/><circle cx="17.2" cy="15" r="2.6"/><circle cx="16" cy="18.8" r="2.6"/><circle cx="12" cy="18.8" r="2.6"/><circle cx="10.8" cy="15" r="2.6"/></g>
  <circle cx="14" cy="16" r="1.4" fill="#c98d6a"/>
</pattern>
<pattern id="floral-v" href="#floral" xlink:href="#floral" patternTransform="rotate(90)"/>
<pattern id="sprig" width="46" height="44" patternUnits="userSpaceOnUse" patternTransform="translate(0 168)">
  <rect width="46" height="44" fill="#ece3cf"/>
  <g fill="none" stroke="#7f7b4c" stroke-width="1.3" stroke-linecap="round">
    <path d="M12,40 C12,30 14,22 18,12 M13,32 L7,27 M14,26 L20,21 M16,19 L11,14 M17,14 L22,9"/>
    <path d="M34,38 C33,32 34,27 37,20 M34,32 L29,29 M35,27 L40,24"/>
  </g>
</pattern>
<pattern id="iri" width="1" height="1" patternContentUnits="objectBoundingBox"><rect width="1" height="1" fill="#f4f6fb"/><circle cx=".3" cy=".35" r=".35" fill="#cfe6ff"/><circle cx=".7" cy=".6" r=".3" fill="#f8d4ec"/><circle cx=".5" cy=".85" r=".2" fill="#fff1bf"/></pattern>
<radialGradient id="clear" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f4f1f6"/><stop offset=".7" stop-color="#d4ccd8"/><stop offset="1" stop-color="#b3a9b8"/></radialGradient>
</defs>

<rect x="4" y="4" width="492" height="322" rx="40" fill="url(#metal)" stroke="#b3ab9e" stroke-width="2"/>
<rect x="4" y="4" width="492" height="322" rx="40" fill="#fff" filter="url(#grain)"/>
<rect x="4" y="4" width="492" height="322" rx="40" fill="url(#sheen)"/>
<rect x="11" y="11" width="478" height="308" rx="34" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5"/>

<!-- washi tape -->
<g clip-path="url(#body)">
  <path d="M0,166 L500,170 L500,212 L0,208 Z" fill="url(#sprig)" opacity=".95"/>
  <path d="M0,126 L500,131 L500,163 L0,158 Z" fill="url(#floral)" opacity=".94"/>
  <path d="M194,0 L227,0 L230,330 L197,330 Z" fill="url(#floral-v)" opacity=".94"/>
  <path d="M227,0 L230,330" stroke="#000" stroke-opacity=".08"/>
</g>

<!-- dark brown star -->
<g transform="translate(92 70) rotate(-14)" filter="url(#sh)">
  <use href="#star" xlink:href="#star" transform="scale(46)" fill="#fff" stroke="#fff" stroke-width=".34" stroke-linejoin="round"/>
  <use href="#star" xlink:href="#star" transform="scale(46)" fill="#5a2c31" stroke="#5a2c31" stroke-width=".14" stroke-linejoin="round"/>
  <use href="#star" xlink:href="#star" transform="scale(37)" fill="none" stroke="#b78a90" stroke-width=".04" stroke-dasharray=".1 .08" stroke-linejoin="round"/>
</g>

<!-- dark bow with a pearl -->
<g transform="translate(305 72)" filter="url(#sh)">
  <g fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round">
    <path d="M0,0 C-10,-26 -50,-32 -52,-8 C-54,12 -28,22 0,0Z M0,0 C10,-26 50,-32 52,-8 C54,12 28,22 0,0Z M-5,4 L-24,42 L-14,39 L-8,47 L3,6Z M5,4 L24,42 L14,39 L8,47 L-3,6Z"/>
  </g>
  <g fill="#3b2326">
    <path d="M-5,4 L-24,42 L-14,39 L-8,47 L3,6Z M5,4 L24,42 L14,39 L8,47 L-3,6Z" fill="#2e1a1d"/>
    <path d="M0,0 C-10,-26 -50,-32 -52,-8 C-54,12 -28,22 0,0Z M0,0 C10,-26 50,-32 52,-8 C54,12 28,22 0,0Z"/>
  </g>
  <path d="M-12,-6 C-22,-16 -38,-18 -42,-8 M12,-6 C22,-16 38,-18 42,-8" fill="none" stroke="#5e4245" stroke-width="2" stroke-linecap="round"/>
  <rect x="-9" y="-10" width="18" height="20" rx="7" fill="#2e1a1d"/>
  <circle r="8" fill="url(#pearl)"/>
</g>

<!-- cream envelope on a dark red square -->
<g transform="translate(424 78) rotate(3)" filter="url(#sh)">
  <rect x="-48" y="-46" width="96" height="92" rx="5" fill="#fff"/>
  <rect x="-43" y="-41" width="86" height="82" rx="3" fill="#7a2e2e"/>
  <rect x="-32" y="-22" width="64" height="48" rx="3" fill="#efe3cd"/>
  <path d="M-32,-22 L0,6 L32,-22" fill="none" stroke="#d3bf9e" stroke-width="2"/>
  <path d="M0,16 C-12,6 -10,-4 -3,-2 C-1,-1 0,1 0,2 C0,1 1,-1 3,-2 C10,-4 12,6 0,16Z" fill="#b8434b"/>
  <circle cy="4" r="4" fill="url(#pearl)"/>
  <g transform="translate(30 -30) rotate(12)">
    <use href="#star" xlink:href="#star" transform="scale(14)" fill="#f19fba" stroke="#f19fba" stroke-width=".1" stroke-linejoin="round"/>
    <use href="#star" xlink:href="#star" transform="scale(7)" fill="#fcd6e3"/>
  </g>
</g>

<!-- lavender flower sticker with a little cat -->
<g transform="translate(100 250)" filter="url(#sh)">
  <g fill="#fff"><circle cx="0" cy="-30" r="36"/><circle cx="28.5" cy="-9.3" r="36"/><circle cx="17.6" cy="24.3" r="36"/><circle cx="-17.6" cy="24.3" r="36"/><circle cx="-28.5" cy="-9.3" r="36"/></g>
  <g fill="#b69ac2"><circle cx="0" cy="-27" r="30"/><circle cx="25.7" cy="-8.3" r="30"/><circle cx="15.9" cy="21.8" r="30"/><circle cx="-15.9" cy="21.8" r="30"/><circle cx="-25.7" cy="-8.3" r="30"/></g>
  <g fill="none" stroke="#d9c6e0" stroke-width="1.4" stroke-dasharray="3 3"><circle cx="0" cy="-27" r="25"/><circle cx="25.7" cy="-8.3" r="25"/><circle cx="15.9" cy="21.8" r="25"/><circle cx="-15.9" cy="21.8" r="25"/><circle cx="-25.7" cy="-8.3" r="25"/></g>
  <!-- cat -->
  <path d="M-26,0 L-24,-30 L-10,-18 C-4,-20 4,-20 10,-18 L24,-30 L26,0 C26,18 14,26 0,26 C-14,26 -26,18 -26,0Z" fill="#ecc8ae" stroke="#c99f86" stroke-width="1.2"/>
  <path d="M-20,-22 L-19,-12 L-13,-16Z M20,-22 L19,-12 L13,-16Z" fill="#e3a8a6"/>
  <ellipse cx="-10" cy="0" rx="2.6" ry="3.2" fill="#4b3533"/><ellipse cx="10" cy="0" rx="2.6" ry="3.2" fill="#4b3533"/>
  <path d="M-2.5,7 L2.5,7 L0,10Z" fill="#d98b8f"/>
  <path d="M0,10 C-2,14 -6,14 -7,12 M0,10 C2,14 6,14 7,12 M-14,8 L-30,5 M-14,11 L-30,13 M14,8 L30,5 M14,11 L30,13" fill="none" stroke="#7a5a52" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="-16" cy="9" r="3.5" fill="#f0a9a9" opacity=".5"/><circle cx="16" cy="9" r="3.5" fill="#f0a9a9" opacity=".5"/>
  <path d="M-14,23 C-6,28 6,28 14,23" fill="none" stroke="#d9879a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cy="29" r="3.6" fill="url(#gold)"/>
</g>

<!-- two red hair clips -->
<g transform="translate(330 262) rotate(-6)" filter="url(#sh)">
  <path d="M-64,-30 Q-74,-16 -64,-2 L60,-8 Q70,-16 60,-24 Z M-64,6 Q-74,20 -64,34 L60,28 Q70,20 60,12 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
  <g fill="#b5423a"><path d="M-64,-30 Q-74,-16 -64,-2 L60,-8 Q70,-16 60,-24 Z"/><path d="M-64,6 Q-74,20 -64,34 L60,28 Q70,20 60,12 Z"/></g>
  <g fill="#dcd7cf"><path d="M-48,-21 Q-52,-16 -48,-11 L44,-14 Q48,-16 44,-18 Z"/><path d="M-48,15 Q-52,20 -48,25 L44,22 Q48,20 44,18 Z"/></g>
  <path d="M-60,-26 L50,-22 M-60,10 L50,14" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- clear button -->
<g transform="translate(446 258)" filter="url(#sh)">
  <circle r="36" fill="#fff"/>
  <circle r="30" fill="url(#clear)"/>
  <circle r="22" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="-7" r="3.2" fill="#9d93a3"/><circle cx="7" r="3.2" fill="#9d93a3"/>
  <path d="M-7,0 L7,0" stroke="#d6c07a" stroke-width="3" stroke-linecap="round"/>
  <path d="M-20,-14 A24,24 0 0 1 -4,-24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
</g>

<!-- sparkly sequins -->
<g stroke="#fff" stroke-width="1.6" filter="url(#sh)">
  <g transform="translate(212 40)"><circle r="7" fill="url(#iri)"/><circle r="1.8" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(152 108)"><circle r="7" fill="url(#iri)"/><circle r="1.8" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(262 146)"><circle r="6.5" fill="url(#iri)"/><circle r="1.6" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(392 154)"><circle r="7" fill="url(#iri)"/><circle r="1.8" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(176 230)"><circle r="7" fill="url(#iri)"/><circle r="1.8" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(250 300)"><circle r="7.5" fill="url(#iri)"/><circle r="1.8" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(402 302)"><circle r="6" fill="url(#iri)"/><circle r="1.5" fill="#e6e1ec" stroke="none"/></g>
  <g transform="translate(34 196)"><circle r="6" fill="url(#iri)"/><circle r="1.5" fill="#e6e1ec" stroke="none"/></g>
</g>
</svg>
