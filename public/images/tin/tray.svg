<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330">
<!-- Bottom half of the tin (the tray), seen from above -->
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1eee8"/><stop offset=".45" stop-color="#d9d4cb"/><stop offset=".7" stop-color="#e7e3dc"/><stop offset="1" stop-color="#cbc5ba"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity=".3"/><stop offset=".84" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3b2a20" flood-opacity=".28"/></filter>
<radialGradient id="pearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ece6de"/><stop offset="1" stop-color="#bdb3a8"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0dc9c"/><stop offset=".5" stop-color="#c9a957"/><stop offset="1" stop-color="#9c7d36"/></linearGradient>
<clipPath id="body"><rect x="4" y="4" width="492" height="322" rx="40"/></clipPath>
<path id="star" d="M0,-1 L0.235,-0.324 L0.951,-0.309 L0.38,0.124 L0.588,0.809 L0,0.4 L-0.588,0.809 L-0.38,0.124 L-0.951,-0.309 L-0.235,-0.324Z"/>
<linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9a297"/><stop offset=".22" stop-color="#cbc5bb"/><stop offset="1" stop-color="#dcd7cf"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset=".08" stop-color="#000" stop-opacity="0"/><stop offset=".92" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient>
</defs>
<rect x="4" y="4" width="492" height="322" rx="40" fill="url(#metal)" stroke="#b3ab9e" stroke-width="2"/>
<rect x="4" y="4" width="492" height="322" rx="40" fill="#fff" filter="url(#grain)"/>
<rect x="4" y="4" width="492" height="322" rx="40" fill="url(#sheen)"/>
<rect x="11" y="11" width="478" height="308" rx="34" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5"/>
<rect x="18" y="18" width="464" height="294" rx="28" fill="url(#inner)"/>
<rect x="18" y="18" width="464" height="294" rx="28" fill="url(#side)"/>
<rect x="18" y="18" width="464" height="294" rx="28" fill="#fff" filter="url(#grain)" opacity=".7"/>
<rect x="18" y="18" width="464" height="294" rx="28" fill="none" stroke="#9e978b" stroke-width="2"/>
</svg>
