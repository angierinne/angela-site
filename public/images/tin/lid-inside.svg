<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 330">
<!-- Inside of the lid: "AW" letter stickers and little charms (original illustration) -->
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1eee8"/><stop offset=".45" stop-color="#d9d4cb"/><stop offset=".7" stop-color="#e7e3dc"/><stop offset="1" stop-color="#cbc5ba"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity=".3"/><stop offset=".84" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#3b2a20" flood-opacity=".28"/></filter>
<radialGradient id="pearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ece6de"/><stop offset="1" stop-color="#bdb3a8"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0dc9c"/><stop offset=".5" stop-color="#c9a957"/><stop offset="1" stop-color="#9c7d36"/></linearGradient>
<clipPath id="body"><rect x="4" y="4" width="492" height="322" rx="40"/></clipPath>
<path id="star" d="M0,-1 L0.235,-0.324 L0.951,-0.309 L0.38,0.124 L0.588,0.809 L0,0.4 L-0.588,0.809 L-0.38,0.124 L-0.951,-0.309 L-0.235,-0.324Z"/>
<linearGradient id="recess" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfcac1"/><stop offset=".15" stop-color="#dedad3"/><stop offset="1" stop-color="#e4e0d9"/></linearGradient>
<linearGradient id="denim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f7298"/><stop offset="1" stop-color="#3f4f73"/></linearGradient>
</defs>
<rect x="4" y="4" width="492" height="322" rx="40" fill="url(#metal)" stroke="#b3ab9e" stroke-width="2"/>
<rect x="4" y="4" width="492" height="322" rx="40" fill="#fff" filter="url(#grain)"/>
<rect x="4" y="4" width="492" height="322" rx="40" fill="url(#sheen)"/>
<rect x="11" y="11" width="478" height="308" rx="34" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5"/>
<rect x="20" y="20" width="460" height="290" rx="26" fill="url(#recess)"/>
<rect x="20" y="20" width="460" height="290" rx="26" fill="#fff" filter="url(#grain)" opacity=".8"/>
<rect x="20" y="20" width="460" height="290" rx="26" fill="none" stroke="#a9a296" stroke-width="2"/>
<rect x="23" y="23" width="454" height="284" rx="24" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>

<!-- A W letter stickers -->
<g filter="url(#sh)">
  <g transform="translate(214 165) rotate(-2)">
    <rect x="-30" y="-34" width="60" height="68" rx="10" fill="#efdcae" stroke="#fff" stroke-width="4"/>
    <rect x="-21" y="-25" width="42" height="50" rx="5" fill="#9b958d"/>
    <path d="M-13,19 L-4,-19 L4,-19 L13,19 L5,19 L3,10 L-3,10 L-5,19Z M-2,4 L2,4 L0,-8Z" fill="#4a4643" fill-rule="evenodd" stroke="#eae6df" stroke-width="1.2"/>
  </g>
  <g transform="translate(290 165) rotate(1.5)">
    <rect x="-34" y="-34" width="68" height="68" rx="10" fill="#efdcae" stroke="#fff" stroke-width="4"/>
    <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#8f7f6c"/>
    <path d="M-17,-15 L-9,-15 L-6,6 L-2,-9 L2,-9 L6,6 L9,-15 L17,-15 L10,16 L4,16 L0,1 L-4,16 L-10,16Z" fill="#f7f2e8" stroke="#5a4c3e" stroke-width="1.4"/>
  </g>
</g>

<!-- top-left: dark button, gold star, pearl -->
<g filter="url(#sh)">
  <g transform="translate(74 72)"><circle r="25" fill="#fff"/><circle r="20" fill="#2f2b2a"/>
    <g fill="#8d8784"><circle cx="-7" cy="-7" r="2"/><circle cx="0" cy="-9" r="2"/><circle cx="7" cy="-7" r="2"/><circle cx="-9" cy="0" r="2"/><circle cx="0" cy="0" r="2"/><circle cx="9" cy="0" r="2"/><circle cx="-7" cy="7" r="2"/><circle cx="0" cy="9" r="2"/><circle cx="7" cy="7" r="2"/></g></g>
  <g transform="translate(150 88) rotate(8)"><use href="#star" xlink:href="#star" transform="scale(30)" fill="#fff" stroke="#fff" stroke-width=".36" stroke-linejoin="round"/><use href="#star" xlink:href="#star" transform="scale(30)" fill="url(#gold)" stroke="#b8974a" stroke-width=".05" stroke-linejoin="round"/></g>
  <g transform="translate(64 132)"><circle r="19" fill="#fff"/><circle r="14" fill="url(#pearl)"/></g>
</g>

<!-- top-right: yellow hair clip with an orange bow -->
<g transform="translate(392 76) rotate(12)" filter="url(#sh)">
  <path d="M-62,-10 Q-70,0 -62,10 L34,6 Q40,0 34,-6Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M-62,-10 Q-70,0 -62,10 L34,6 Q40,0 34,-6Z" fill="#e9b949"/>
  <path d="M-50,-4 Q-53,0 -50,4 L26,2 Q29,0 26,-2Z" fill="#f6dc93"/>
  <g transform="translate(34 0)">
    <path d="M0,0 C-6,-24 -30,-26 -28,-6 C-27,8 -12,10 0,0Z M0,0 C6,-24 30,-26 28,-6 C27,8 12,10 0,0Z M0,0 C-10,10 -22,24 -12,28 C-4,30 0,14 0,0Z M0,0 C10,10 22,24 12,28 C4,30 0,14 0,0Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M0,0 C-6,-24 -30,-26 -28,-6 C-27,8 -12,10 0,0Z M0,0 C6,-24 30,-26 28,-6 C27,8 12,10 0,0Z M0,0 C-10,10 -22,24 -12,28 C-4,30 0,14 0,0Z M0,0 C10,10 22,24 12,28 C4,30 0,14 0,0Z" fill="#e48d3c"/>
    <path d="M-4,-4 C-8,-18 -24,-19 -23,-7 M4,-4 C8,-18 24,-19 23,-7" fill="none" stroke="#b86a28" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
    <rect x="-6" y="-7" width="12" height="13" rx="4" fill="#c9702c"/>
  </g>
</g>

<!-- bottom-left: denim patch with a star, bunny -->
<g filter="url(#sh)">
  <g transform="translate(78 258)"><circle r="36" fill="#fff"/><circle r="30" fill="url(#denim)"/><circle r="26" fill="none" stroke="#8fa0c2" stroke-width="1.2" stroke-dasharray="3 3"/>
    <use href="#star" xlink:href="#star" transform="scale(18)" fill="#8fa1c5" stroke="#8fa1c5" stroke-width=".1" stroke-linejoin="round"/><circle cx="2" cy="-1" r="5" fill="#3f4f73"/></g>
  <g transform="translate(140 262) rotate(-6)">
    <path d="M-22,26 C-28,4 -18,-6 -10,-8 C-16,-30 -10,-38 -4,-36 C2,-34 2,-20 0,-10 C4,-28 12,-34 16,-30 C20,-26 14,-12 8,-6 C20,-2 26,10 20,26Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-22,26 C-28,4 -18,-6 -10,-8 C-16,-30 -10,-38 -4,-36 C2,-34 2,-20 0,-10 C4,-28 12,-34 16,-30 C20,-26 14,-12 8,-6 C20,-2 26,10 20,26Z" fill="#fffaf1" stroke="#cdbfae" stroke-width="1.6"/>
    <path d="M-6,-30 C-5,-24 -4,-16 -4,-12 M10,-27 C8,-20 6,-14 4,-10" stroke="#f0c3c3" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-6" cy="8" r="1.8" fill="#4b3d38"/><circle cx="6" cy="8" r="1.8" fill="#4b3d38"/>
    <path d="M-2,13 Q0,15 2,13" fill="none" stroke="#4b3d38" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</g>

<!-- bottom-right: pearl, small star, flowery button -->
<g filter="url(#sh)">
  <g transform="translate(344 250)"><circle r="17" fill="#fff"/><circle r="12.5" fill="url(#pearl)"/></g>
  <g transform="translate(378 292) rotate(-10)"><use href="#star" xlink:href="#star" transform="scale(17)" fill="#fff" stroke="#fff" stroke-width=".5" stroke-linejoin="round"/><use href="#star" xlink:href="#star" transform="scale(17)" fill="url(#gold)" stroke="#b8974a" stroke-width=".07" stroke-linejoin="round"/></g>
  <g transform="translate(430 262)"><circle r="31" fill="#fff"/><circle r="25" fill="#f6ece8" stroke="#e8d6d0"/>
    <g fill="#f0a8b4"><circle cx="-12" cy="-10" r="3.2"/><circle cx="10" cy="-13" r="3.2"/><circle cx="14" cy="8" r="3.2"/><circle cx="-10" cy="12" r="3.2"/><circle cx="0" cy="-18" r="2.4"/><circle cx="-18" cy="2" r="2.4"/><circle cx="18" cy="-3" r="2.4"/><circle cx="2" cy="18" r="2.4"/></g>
    <g fill="#9c8478"><circle cx="-4" cy="-4" r="2"/><circle cx="4" cy="-4" r="2"/><circle cx="-4" cy="4" r="2"/><circle cx="4" cy="4" r="2"/></g></g>
</g>
</svg>
